allowBuilds:
  esbuild: true

# Block dependencies from using non-registry sources (git repos, tarballs)
blockExoticSubdeps: true

# Wait 1 week before allowing newly published packages to be installed,
# except for first-party packages
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@projectwallace/*'

# Prevent trust level downgrades compared to previously installed packages
trustPolicy: no-downgrade

catalog:
  '@projectwallace/css-parser': ~0.19.4

# Make sure transitive deps (like @projectwallace/format-css) use the same css-parser
overrides:
  '@projectwallace/css-parser': 'catalog:'
